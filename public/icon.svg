<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  
  <!-- Subtle circular progress ring glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#818cf8" stroke-width="12" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fbbf24" stroke-width="12" stroke-dasharray="700 1000" stroke-linecap="round"/>
  
  <!-- Book graphics inside -->
  <g transform="translate(146, 146)">
    <!-- Book pages / sheets background -->
    <rect x="25" y="35" width="160" height="170" rx="16" fill="#ffffff" />
    <path d="M 35 190 Q 110 215 185 190 L 185 50 Q 110 75 35 50 Z" fill="#ffffff" />
    <path d="M 35 50 L 35 190 Q 110 215 185 190 L 185 50 C 140 40 80 40 35 50" fill="#e0e7ff" />
    
    <!-- Checklist items inside book -->
    <line x1="65" y1="90" x2="135" y2="90" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <line x1="65" y1="125" x2="155" y2="125" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    <line x1="65" y1="160" x2="115" y2="160" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" />
    
    <!-- Tiny decorative dots -->
    <circle cx="155" cy="90" r="6" fill="#fbbf24" />
    <circle cx="135" cy="160" r="6" fill="#fbbf24" />
  </g>
  
  <!-- Standalone Checkmark Badge overlay at bottom-right of the icon -->
  <circle cx="360" cy="360" r="50" fill="#fbbf24" stroke="#4f46e5" stroke-width="10" />
  <path d="M 338 360 L 353 375 L 383 345" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
